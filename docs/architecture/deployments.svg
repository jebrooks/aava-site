<text x="76" y="1037" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#946016" text-anchor="start">Environment settings: configure Vercel Preview and Production separately. GitHub Actions has its own credentials.</text>
<text x="76" y="1070" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#292B36" text-anchor="start">A Preview can use the same Shopify store or email service as Production; isolation depends on configured credentials.</text>
<text x="52" y="1125" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#596375" text-anchor="start">Daily Vercel Cron runs on Production only. No DNS cutover is implied by a deployment or canonical URL.</text>
